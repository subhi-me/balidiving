<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <body>
      <center>
        <div><h1>Snorkeling in
Padang Bai<h1></div>
        <div id="pesan"></div>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
        <script>
            var url = "https://balidiving.com/scuba-diving-cost-pricelist"; // url tujuan
            var count = 10; // dalam detik
            function countDown() {
                if (count > 0) {
                    count--;
                    var waktu = count + 1;
                    $('#pesan').html('<h3>You will navigate to an easy step booking system <br> If you would like create Enquery Please select one option below before it is time over.<br><span style="color:blue"><b>' + waktu + '</b> sec.</span></h3><br> <img src="support/bdloader.gif"> <br><a class="btn btn-primary" href="https://booking.balidiving.com/" role="button">Enquire Now</a><br><br><a class="btn btn-primary" href="https://reservation.balidiving.com/BaliDiving/booking/rsv/detail_widget/?code_vendor=BDO&code_product=BDO8544" role="button">Booking Now</a>');
                    setTimeout("countDown()", 1000);
                } else {
                    window.location.href = url;
                }
            }
            countDown();
        </script>
        </center>
    </body>
