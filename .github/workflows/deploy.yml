name: Deploy Website ke cPanel

on:
  push:
    branches:
      - main  # Memicu deploy otomatis setiap ada push ke branch main

jobs:
  web-deploy:
    name: 🎉 Deploy via FTP
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Ambil kode terbaru
      uses: actions/checkout@v4
    
    - name: 🚀 Upload file ke cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./  # Folder di GitHub yang mau di-upload
        server-dir: /public_html/  # Folder tujuan di cPanel (sesuaikan jalur FTP kamu)
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**