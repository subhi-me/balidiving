<!doctype html>
<html>
    <head>
        <title>Bali Reccomendations</title>
        <meta name="description" content="Balidiving Recommendations, Blog, and News.">
    </head>
    <body>
      <center>
        <div><h1>Bali Recommendations<h1></div>
        <div id="pesan"></div>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
        <script>
            var url = "https://blog.balidiving.com"; // url tujuan
            var count = 2; // dalam detik
            function countDown() {
                if (count > 0) {
                    count--;
                    var waktu = count + 1;
                    $('#pesan').html(' navigate to Bali Diving Blog <a href="' + url + '">'+url+'</a> in ' + waktu + ' sec.<br> <img src="support/bdloader.gif">');
                    setTimeout("countDown()", 1000);
                } else {
                    window.location.href = url;
                }
            }
            countDown();
        </script>
        </center>
    </body>
</html>
