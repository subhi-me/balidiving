<!DOCTYPE html>
<html>
<head>
  <title>My Page</title>
  <style type="text/css">
    /* Define a class for the columns */
    .column {
      width: 25%; /* Set the width to 25% */
      float: left; /* Float the column to the left */
      box-sizing: border-box; /* Include padding and border in the width */
      padding: 10px; /* Add some padding */
      border: 1px solid #ccc; /* Add a border */
    }

    /* Clear the floats after the columns */
    .row:after {
      content: "";
      clear: both;
      display: table;
    }

    /* Define the navbar */
    .navbar {
      overflow: hidden; /* Hide overflow */
      background-color: #333; /* Set the background color */
      font-family: Arial, sans-serif; /* Set the font */
    }

    /* Style the navbar links */
    .navbar a {
      float: left; /* Float the links to the left */
      display: block; /* Display the links as blocks */
      color: white; /* Set the text color */
      text-align: center; /* Center the text */
      padding: 14px 20px; /* Add some padding */
      text-decoration: none; /* Remove underline */
    }

    /* Change the color of the links on hover */
    .navbar a:hover {
      background-color: #ddd;
      color: black;
    }

    /* Hide the navbar when the screen is less than 600px wide */
    @media screen and (max-width: 600px) {
      .navbar a {
        float: none;
        display: block;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <!-- Create the navbar -->
  <div class="navbar">
    <a href="#">Menu 1</a>
    <a href="#">Menu 2</a>
    <a href="#">Menu 3</a>
  </div>

  <!-- Create a row container for the columns -->
  <div class="row">
    <!-- Add four columns -->
    <div class="column">Column 1</div>
    <div class="column">Column 2</div>
    <div class="column">Column 3</div>
    <div class="column">Column 4</div>
  </div>
</body>
</html>
